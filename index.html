<style>
/* ===== COLORS: edit the variables here ===== */
:root{--primary:#2457F5;--secondary:#0F9F8F;--bg:#F6F8FB;--surface:#fff;--ink:#0F172A;--muted:#475569;--line:#E2E8F0;--shadow:0 8px 24px rgba(15,23,42,.07);--r:16px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--primary:#6D93FF;--secondary:#2DD4BF;--bg:#0B1220;--surface:#131C2E;--ink:#F1F5F9;--muted:#A3B1C6;--line:#24304A;--shadow:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--primary:#6D93FF;--secondary:#2DD4BF;--bg:#0B1220;--surface:#131C2E;--ink:#F1F5F9;--muted:#A3B1C6;--line:#24304A;--shadow:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:17px;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px;border-radius:6px}
.wrap{width:min(1080px,100% - 40px);margin-inline:auto}
